<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>Word Spies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#12141a; --panel:#1b1e27; --panel2:#242835; --line:#2f3443;
  --ink:#f3efe4; --muted:#9aa0b2; --card:#ece4cf; --card-ink:#23201a;
  --red:#e5484d; --red-d:#7d1e22; --blue:#3d7bf7; --blue-d:#1b3a7a;
  --neutral:#cbbf9f; --trap:#07070a; --good:#3dd68c; --warn:#ffb224;
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
input{font:inherit}
.red-t{color:var(--red)} .blue-t{color:var(--blue)}
.muted{color:var(--muted)}
.btn{background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-weight:700;transition:transform .08s,background .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:middle}
.dot.off{background:#555b6b}

/* ---------- landing ---------- */
.landing{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;gap:28px;text-align:center}
.logo{font-size:clamp(44px,9vw,96px);font-weight:800;letter-spacing:-.03em;line-height:.9}
.logo span{display:inline-block;padding:0 .12em;border-radius:.12em}
.logo .r{background:var(--red)} .logo .b{background:var(--blue)}
.landing .choices{display:grid;gap:14px;width:min(420px,100%)}
.landing .choice{padding:20px;border-radius:16px;text-align:left;background:var(--panel);border:1px solid var(--line)}
.landing .choice b{display:block;font-size:20px;margin-bottom:4px}
.landing .choice small{color:var(--muted);font-size:14px}
.codeinput{display:flex;gap:8px;margin-top:12px}
.codeinput input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);text-transform:uppercase;letter-spacing:.3em;font-weight:800;font-size:20px;text-align:center}

/* ---------- host ---------- */
body.host{overflow:hidden}
.H{height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:1.4vh 1.4vw;gap:1.4vh}
.H-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw}
.H-brand{font-weight:800;font-size:clamp(18px,1.8vw,34px);letter-spacing:-.02em}
.H-join{justify-self:end;text-align:right;font-size:clamp(12px,1vw,18px);color:var(--muted)}
.H-join b{color:var(--ink);font-size:1.6em;letter-spacing:.15em}
.turnbar{text-align:center;padding:.8vh 2vw;border-radius:999px;font-weight:800;font-size:clamp(16px,1.7vw,34px);white-space:nowrap}
.turnbar.red{background:var(--red)} .turnbar.blue{background:var(--blue)}
.turnbar .clue{background:rgba(0,0,0,.25);padding:.15em .6em;border-radius:999px;margin-left:.5em}
.H-main{display:grid;grid-template-columns:15vw 1fr 15vw;gap:1.4vw;min-height:0}
.side{background:var(--panel);border-radius:16px;padding:1.6vh 1vw;display:flex;flex-direction:column;gap:1vh;min-height:0;overflow:auto;border-top:6px solid}
.side.red{border-color:var(--red)} .side.blue{border-color:var(--blue)}
.side .big{font-size:clamp(40px,5vw,100px);font-weight:800;line-height:1}
.side .lbl{font-size:clamp(11px,.85vw,16px);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.side.active{box-shadow:0 0 0 3px var(--ink) inset}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5vh}
.roster li{font-size:clamp(13px,1vw,20px);position:relative}
.roster button{text-align:left;width:100%;padding:.3em .2em;border-radius:6px}
.roster button:hover{background:var(--panel2)}
.roster .off{opacity:.45}
.tag{font-size:.7em;font-weight:700;padding:.1em .45em;border-radius:6px;background:var(--ink);color:var(--bg);margin-left:.3em;vertical-align:middle}
.pmenu{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px}
.pmenu button{font-size:12px;padding:4px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.board{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:1vh .9vw;min-height:0}
.card{position:relative;border-radius:12px;background:var(--card);color:var(--card-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(13px,1.85vw,42px);letter-spacing:.02em;text-transform:uppercase;box-shadow:0 .5vh 0 #b9ad8e;transition:transform .2s,background .3s;padding:0 .3em;text-align:center;overflow:hidden}
.card.rev{box-shadow:none;transform:scale(.97)}
.card.rev.red{background:var(--red);color:#fff}
.card.rev.blue{background:var(--blue);color:#fff}
.card.rev.neutral{background:var(--neutral);color:#5c5340}
.card.rev.trap{background:var(--trap);color:#fff;box-shadow:0 0 0 3px var(--red) inset}
.card.rev .w{opacity:.55}
.card.flip{animation:flip .5s}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:rotateX(0) scale(.97)}}
.card .votes{position:absolute;top:.6vh;right:.5vw;display:flex;gap:3px}
.card .votes i{width:clamp(8px,.8vw,16px);height:clamp(8px,.8vw,16px);border-radius:50%;background:var(--turn,#333);border:2px solid #fff}
.card .votes .n{font-style:normal;font-size:clamp(11px,1vw,20px);letter-spacing:0;text-transform:none;font-weight:800;background:var(--turn);color:#fff;border-radius:999px;padding:0 .5em;width:auto;height:auto;border:0}
.board.override .card:not(.rev){cursor:pointer;outline:2px dashed var(--warn);outline-offset:-4px}
.H-bottom{display:flex;align-items:center;gap:1vw}
.event{flex:1;font-size:clamp(14px,1.3vw,26px);font-weight:700;padding:.8vh 1vw;border-radius:12px;background:var(--panel);min-height:2.4em;display:flex;align-items:center}
.event.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1.04);background:var(--panel2)}100%{transform:scale(1)}}
.H-bottom .btn{font-size:clamp(12px,.9vw,17px);padding:.8vh 1vw}
.btn.on{background:var(--warn);color:#000;border-color:var(--warn)}
.net{font-size:12px;color:var(--muted)}
/* host lobby */
.L{height:100vh;display:grid;grid-template-columns:minmax(300px,30vw) 1fr;gap:2vw;padding:3vh 2.5vw}
.L-join{background:var(--panel);border-radius:20px;padding:3vh 2vw;display:flex;flex-direction:column;align-items:center;gap:2vh;text-align:center}
.qr{background:#fff;padding:1.4vh;border-radius:14px;width:min(24vw,40vh);aspect-ratio:1}
.qr svg,.qr img{width:100%;height:100%;display:block}
.L-code{font-size:clamp(40px,5vw,96px);font-weight:800;letter-spacing:.18em;line-height:1}
.L-url{font-size:clamp(12px,1vw,18px);color:var(--muted);word-break:break-all}
.L-right{display:grid;grid-template-rows:auto 1fr auto;gap:2.4vh;min-height:0}
.L-teams{display:grid;grid-template-columns:1fr 1fr;gap:1.6vw;min-height:0}
.L-team{background:var(--panel);border-radius:20px;padding:2vh 1.4vw;border-top:8px solid;overflow:auto}
.L-team.red{border-color:var(--red)} .L-team.blue{border-color:var(--blue)}
.L-team h2{margin:0 0 1vh;font-size:clamp(20px,2vw,40px)}
.L-team .roster li{font-size:clamp(15px,1.35vw,28px)}
.L-actions{display:flex;gap:1vw;flex-wrap:wrap;align-items:center}
.L-actions .btn{font-size:clamp(14px,1.1vw,22px)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw}
.how div{background:var(--panel);border-radius:14px;padding:1.6vh 1vw;font-size:clamp(12px,1vw,19px);color:var(--muted);line-height:1.35}
.how b{display:block;color:var(--ink);font-size:1.15em;margin-bottom:.3em}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3vh;background:rgba(10,11,15,.2);z-index:5;pointer-events:none}
.overlay .win{font-size:clamp(48px,9vw,180px);font-weight:800;letter-spacing:-.03em;padding:.05em .4em;border-radius:.2em;animation:pop .6s}
.overlay .win.red{background:var(--red)} .overlay .win.blue{background:var(--blue)}
.overlay .btn{pointer-events:auto;font-size:clamp(16px,1.4vw,28px)}
.warnbar{background:var(--warn);color:#000;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:700}

/* ---------- phone ---------- */
body.phone{min-height:100%}
.P{max-width:520px;margin:0 auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;min-height:100vh}
.P-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:14px;background:var(--panel);font-weight:700}
.P-head.red{background:var(--red)} .P-head.blue{background:var(--blue)}
.P-head small{font-weight:500;opacity:.85}
.status{background:var(--panel);border-radius:14px;padding:14px;font-size:17px;line-height:1.35}
.status b{font-weight:800}
.status .cluebig{display:block;font-size:30px;font-weight:800;letter-spacing:.02em;margin:2px 0}
.status.hl{background:var(--ink);color:var(--bg)}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.pc{position:relative;aspect-ratio:1.25;border-radius:8px;background:var(--card);color:var(--card-ink);font-weight:800;text-transform:uppercase;font-size:clamp(8.5px,2.75vw,13px);display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;word-break:break-word;line-height:1.05;box-shadow:0 3px 0 #b9ad8e}
.pc.rev{box-shadow:none;opacity:.9}
.pc.rev.red{background:var(--red);color:#fff} .pc.rev.blue{background:var(--blue);color:#fff}
.pc.rev.neutral{background:var(--neutral);color:#6d6450} .pc.rev.trap{background:var(--trap);color:#fff}
.pc.rev .w{opacity:.5;text-decoration:line-through}
.pc.k-red{box-shadow:inset 0 0 0 4px var(--red),0 3px 0 #b9ad8e}
.pc.k-blue{box-shadow:inset 0 0 0 4px var(--blue),0 3px 0 #b9ad8e}
.pc.k-neutral{box-shadow:inset 0 0 0 4px #9c916f,0 3px 0 #b9ad8e;opacity:.8}
.pc.k-trap{background:#2a2a30;color:#fff;box-shadow:inset 0 0 0 4px #000,0 3px 0 #000}
.pc.tap{cursor:pointer}
.pc.tap:active{transform:scale(.95)}
.pc.mine{outline:3px solid var(--ink);outline-offset:2px;transform:translateY(-2px)}
.pc .vc{position:absolute;top:-6px;right:-5px;background:var(--turn);color:#fff;font-size:11px;border-radius:999px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);padding:0 4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted)}
.field input{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);font-size:20px;font-weight:700}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nums button{padding:12px 0;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:18px}
.nums button.sel{background:var(--ink);color:var(--bg)}
.teampick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.teampick button{padding:22px 10px;border-radius:16px;font-weight:800;font-size:22px;border:3px solid transparent;opacity:.55}
.teampick .red{background:var(--red)} .teampick .blue{background:var(--blue)}
.teampick .sel{opacity:1;border-color:var(--ink)}
.teampick small{display:block;font-size:13px;font-weight:600;opacity:.9;margin-top:4px}
.panel{background:var(--panel);border-radius:14px;padding:14px}
.panel h3{margin:0 0 8px;font-size:16px}
.panel ul{margin:0;padding-left:18px;color:var(--muted);line-height:1.45;font-size:15px}
.mates{display:flex;flex-wrap:wrap;gap:6px}
.mates span{background:var(--panel2);padding:5px 10px;border-radius:999px;font-size:14px}
.full{width:100%;padding:16px;font-size:18px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ink);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;font-size:15px;max-width:92vw;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:pop .3s}
.toast.warn{background:var(--warn);color:#000}
.bigwin{font-size:48px;font-weight:800;padding:6px 20px;border-radius:14px}
.bigwin.red{background:var(--red)} .bigwin.blue{background:var(--blue)}
details summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ shared ============ */
const PREFIX = "wordspies-v1-";
const qs = new URLSearchParams(location.search);
const TEAM = { red: "Red", blue: "Blue" };
const other = t => (t === "red" ? "blue" : "red");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const recall = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const code4 = () => { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let s = ""; for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const app = document.getElementById("app");

function peerOpts() {
  const h = qs.get("peerhost");
  return h ? { host: h, port: +(qs.get("peerport") || 9000), path: "/", secure: false, debug: 0 } : { debug: 0 };
}
function keepParams(p) { for (const k of ["peerhost", "peerport"]) if (qs.get(k)) p.set(k, qs.get(k)); return p; }
function baseUrl() { return location.origin + location.pathname; }
function joinUrl(code) { const p = new URLSearchParams(); p.set("join", code); keepParams(p); return baseUrl() + "?" + p; }
function go(params) { location.search = "?" + keepParams(new URLSearchParams(params)); }

const WORDS = ("ANCHOR APPLE ARROW ATLAS BADGE BALLOON BAMBOO BANK BARREL BATTERY BEACH BEAR BELL BELT BENCH BERRY BLADE BLANKET BOARD BONE BOOK BOOT BOTTLE BOW BOX BRAIN BRANCH BRICK BRIDGE BROOM BRUSH BUBBLE BUCKET BUG BUTTON CABIN CABLE CACTUS CAKE CAMERA CAMP CANDLE CANNON CANYON CAPE CARD CARPET CASTLE CAVE CHAIN CHAIR CHALK CHARGE CHEESE CHEF CHERRY CHESS CHIP CIRCLE CIRCUS CLOCK CLOUD CLOVER CLUB COACH COAST COAT COIN COMET COMPASS CONE COOKIE COPPER CORN COTTON COUCH COURT CRANE CROWN CRYSTAL CUP CURTAIN DANCE DART DESERT DIAMOND DICE DINER DOCTOR DOLPHIN DOOR DRAGON DRAIN DREAM DRESS DRILL DRUM DUCK EAGLE ENGINE EYE FAIR FAN FARM FEATHER FENCE FERRY FIELD FILM FIRE FLAG FLAME FLOOD FLUTE FOG FORK FORT FOSSIL FOX FROG FROST GALAXY GARDEN GATE GEAR GHOST GIANT GLASS GLOVE GOLD GRAPE GRASS GRID GUITAR HAMMER HARBOR HARP HAT HAWK HELMET HIVE HONEY HOOK HORN HORSE HOSE HOTEL ICE IGLOO INK ISLAND IVY JACKET JAM JAR JET JUNGLE KETTLE KEY KING KITE KNOT LADDER LAMP LASER LEAF LEMON LENS LETTER LEVER LIGHT LINE LION LOCK LOG MAGNET MAP MARBLE MASK MATCH MAZE MEDAL MENU MILL MINE MINT MIRROR MOON MOTOR MOUSE MUD NAIL NEEDLE NEST NET NIGHT NOTE NURSE OCEAN OIL ORANGE ORBIT OWL PAINT PALACE PALM PAN PANEL PAPER PARK PARROT PASTA PEARL PENCIL PEPPER PIANO PILOT PIN PIPE PIRATE PIZZA PLANE PLANET PLATE PLUG POCKET POLE POOL PORT POST POTATO POWER PRISM PUMP PUPPET PYRAMID QUEEN RABBIT RADAR RADIO RAIN RING RIVER ROBOT ROCK ROCKET ROOF ROOT ROPE ROSE RULER SAIL SALT SAND SATURN SCALE SCARF SCHOOL SCREEN SEAL SHADOW SHARK SHELL SHIP SHOE SIGNAL SILK SKATE SNOW SOCK SODA SOLAR SPACE SPIDER SPIKE SPOON SPRING SQUARE STAMP STAR STATION STEAM STORM STRAW STREAM SUIT SUN SWING SWORD TABLE TAIL TANK TAPE TEMPLE TENT THREAD TIGER TIME TOAST TOKEN TOOTH TORCH TOWER TRACK TRAIN TREE TRUCK TRUMPET TUBE TUNNEL TURKEY UMBRELLA VALLEY VAN VIOLIN VOLCANO WAGON WALL WATCH WAVE WEB WHALE WHEEL WIND WING WIRE WOLF WOOL WORM YARD ZERO").split(" ");

function qrSvg(text) {
  if (typeof qrcode !== "function") return "";
  try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 6, margin: 0, scalable: true }); } catch (e) { return ""; }
}

/* ============ landing ============ */
function Landing() {
  document.body.className = "";
  app.innerHTML = `
  <div class="landing">
    <div class="logo"><span class="r">WORD</span> <span class="b">SPIES</span></div>
    <div class="choices">
      <button class="choice" id="hostBtn"><b>📺 Show the board</b><small>Open this on the TV or laptop everyone can see.</small></button>
      <div class="choice"><b>📱 Join on my phone</b><small>Enter the 4-letter code shown on the board.</small>
        <form class="codeinput" id="jf"><input id="jc" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE" aria-label="Game code"><button class="btn primary">Join</button></form>
      </div>
    </div>
  </div>`;
  document.getElementById("hostBtn").onclick = () => go({ host: "" });
  document.getElementById("jf").onsubmit = e => { e.preventDefault(); const c = document.getElementById("jc").value.toUpperCase().replace(/[^A-Z]/g, ""); if (c.length === 4) go({ join: c }); };
}

/* ============ host ============ */
const Host = (() => {
  let S, peer, retryT, net = "connecting", netDetail = "";
  const conns = new Map(), seen = new Map();
  let ui = { menu: null, override: false, lastEv: 0, lastRev: new Set(), onSig: "" };

  const fresh = code => ({ code, phase: "lobby", players: {}, cards: [], turn: "red", clue: null, left: 0, votes: {}, winner: null, event: null, evId: 0 });
  const save = () => store("ws-host", S);
  const isOn = id => { const c = conns.get(id); return !!(c && c.open && Date.now() - (seen.get(id) || 0) < 15000); };
  const teamOf = t => Object.entries(S.players).filter(([, p]) => p.team === t);
  const clueGiver = t => teamOf(t).find(([, p]) => p.role === "clue");
  const guessers = () => teamOf(S.turn).filter(([id, p]) => p.role === "guess" && isOn(id));
  const remain = k => S.cards.filter(c => c.c === k && !c.rev).length;
  const clean = n => String(n || "").replace(/\s+/g, " ").trim().slice(0, 18) || "Player";

  function start() {
    S = recall("ws-host");
    if (!S || !S.code || !S.players) S = fresh(code4());
    document.body.className = "host";
    connect();
    setInterval(tick, 3000);
    render();
  }
  function connect() {
    clearTimeout(retryT);
    try { peer && peer.destroy(); } catch (e) {}
    setNet("connecting");
    const p = (peer = new Peer(PREFIX + S.code, peerOpts()));
    p.on("open", () => setNet("online"));
    p.on("connection", conn => {
      conn.on("data", d => onMsg(conn, d));
      conn.on("close", () => { for (const [id, c] of conns) if (c === conn) conns.delete(id); refresh(); });
      conn.on("error", () => {});
    });
    p.on("disconnected", () => { if (p === peer && !p.destroyed) { setNet("reconnecting"); setTimeout(() => { if (p === peer && !p.destroyed && p.disconnected) try { p.reconnect(); } catch (e) {} }, 1500); } });
    p.on("error", e => {
      if (p !== peer) return;
      setNet("error", e.type);
      if (["unavailable-id", "network", "server-error", "socket-error", "socket-closed"].includes(e.type)) retryT = setTimeout(connect, e.type === "unavailable-id" ? 5000 : 3000);
    });
  }

      <div class="P-head ${me.team}"><span>${esc(me.name)} <small>· ${me.role === "clue" ? "Clue giver" : "Guesser"}</small></span><span>${TEAM[me.team]} team</span></div>
      ${body}</div>`;
    if (focusId === "cw") { const el = document.getElementById("cw"); if (el) { el.focus(); if (sel) el.setSelectionRange(sel[0], sel[1]); } }

    const myClueTurn = V.phase === "play" && me.role === "clue" && V.turn === me.team && !V.clue;
    if (myClueTurn && !ui.wasMyClueTurn && navigator.vibrate) navigator.vibrate([120, 60, 120]);
    ui.wasMyClueTurn = myClueTurn;
  }
  function lobbyHtml(me) {
    const mates = V.players.filter(p => p.team === me.team);
    const cnt = t => V.players.filter(p => p.team === t).length;
    const giver = mates.find(p => p.role === "clue");
    return `
      <div class="status">You're in! Pick a team, then wait for the host to start.</div>
      <div class="teampick">
        <button class="red ${me.team === "red" ? "sel" : ""}" data-team="red">Red<small>${cnt("red")} player${cnt("red") === 1 ? "" : "s"}</small></button>
        <button class="blue ${me.team === "blue" ? "sel" : ""}" data-team="blue">Blue<small>${cnt("blue")} player${cnt("blue") === 1 ? "" : "s"}</small></button>
      </div>
      <div class="panel">
        <h3>Clue giver for ${TEAM[me.team]}</h3>
        ${me.role === "clue"
          ? `<p style="margin:0 0 10px">That's you! You'll see the secret key and give one-word clues.</p><button class="btn full" data-role="0">Step down</button>`
          : giver ? `<p style="margin:0" class="muted">${esc(giver.name)} is giving clues.</p>`
          : `<p style="margin:0 0 10px" class="muted">Nobody yet. The clue giver sees which words belong to your team.</p><button class="btn primary full" data-role="1">I'll give the clues</button>`}
      </div>
      <div class="panel"><h3>Your team</h3><div class="mates">${mates.map(p => `<span>${p.on ? "" : "💤 "}${esc(p.name)}${p.me ? " (you)" : ""}${p.role === "clue" ? " 🔎" : ""}</span>`).join("")}</div></div>
      ${howHtml(true)}
      <button class="btn" data-rename="1">Change my name</button>`;
  }
  function howHtml(open) {
    return `<details class="panel" ${open ? "open" : ""}><summary>How to play</summary><ul style="margin-top:8px">
      <li>Two teams race to find all their secret words on the big screen.</li>
      <li><b>Clue givers</b> see the key on their phone and send <b>one word + a number</b> (how many words it links to).</li>
      <li><b>Guessers</b> tap a word to vote. When most of the team picks the same word, it flips.</li>
      <li>Your color: keep going. Other team or beige: turn ends. <b>Black trap card: you lose.</b></li>
      <li>You get the number + 1 guesses. Vote "End turn" to stop early.</li></ul></details>`;
  }
  function gameHtml(me) {
    const over = V.phase === "over";
    const myTurn = V.turn === me.team;
    const isClue = me.role === "clue";
    const canVote = !over && myTurn && !isClue && V.clue && V.votes;
    let status = "";
    if (over) status = `<div class="center" style="flex:0;padding:10px"><div class="bigwin ${V.winner}">${TEAM[V.winner]} wins!</div><div class="muted">${V.winner === me.team ? "Nice work, team. 🎉" : "Good game."} Waiting for the host to start another round.</div></div>`;
    else if (isClue && myTurn && !V.clue) status = clueForm();
    else if (!myTurn) status = `<div class="status"><b>${TEAM[V.turn]} team's turn.</b> ${V.clue ? `Their clue: <span class="cluebig">${esc(V.clue.word)} · ${V.clue.num}</span>` : "Waiting for their clue…"}<div class="muted" style="font-size:14px;margin-top:4px">Sit tight — you can't vote until it's your turn.</div></div>`;
    else if (!V.clue) status = `<div class="status"><b>Your turn!</b> Waiting for ${esc((V.players.find(p => p.team === me.team && p.role === "clue") || {}).name || "your clue giver")}'s clue…</div>`;
    else if (isClue) status = `<div class="status">Your team is guessing <span class="cluebig">${esc(V.clue.word)} · ${V.clue.num}</span><span class="muted">${V.left} guess${V.left === 1 ? "" : "es"} left. No hints — just watch!</span></div>`;
    else {
      const v = V.votes;
      status = `<div class="status hl">Clue: <span class="cluebig">${esc(V.clue.word)} · ${V.clue.num}</span>
        Tap a word to vote. It flips at <b>${v.need} of ${v.n}</b> votes. ${V.left} guess${V.left === 1 ? "" : "es"} left.</div>`;
    }
    const v = V.votes;
    const grid = `<div class="pgrid">${V.cards.map((c, i) => {
      let cls = "pc";
      if (c.rev || over) cls += " rev " + c.c;
      else if (isClue && c.c) cls += " k-" + c.c;
      const tappable = canVote && !c.rev;
      if (tappable) cls += " tap";
      if (canVote && v.mine === i) cls += " mine";
      const n = canVote ? v.t[i] || 0 : 0;
      return `<div class="${cls}" ${tappable ? `data-vote="${i}" role="button"` : ""}><span class="w">${esc(c.w)}</span>${n ? `<span class="vc">${n}</span>` : ""}</div>`;
    }).join("")}</div>`;
    const legend = isClue && !over ? `<div class="legend"><span><i style="background:var(--${me.team})"></i>Your team</span><span><i style="background:var(--${other(me.team)})"></i>Other team</span><span><i style="background:#9c916f"></i>Bystander</span><span><i style="background:#000;border:1px solid #666"></i>Trap — avoid!</span></div>` : "";
    const passBtn = canVote ? `<button class="btn full ${v.mine === "pass" ? "primary" : ""}" data-vote="pass">${v.mine === "pass" ? "✓ You voted to end turn" : "Vote to end our turn"} (${v.t.pass || 0}/${v.need})</button>` : "";
    const score = `<div class="legend" style="justify-content:space-between;font-size:14px"><span class="red-t">Red: ${V.remain.red} left</span><span class="muted">Code ${esc(V.code)}</span><span class="blue-t">Blue: ${V.remain.blue} left</span></div>`;
    return status + grid + legend + passBtn + score + howHtml(false);
  }
  function clueForm() {
    return `<div class="status hl"><b>Your turn to give a clue!</b><div style="font-size:14px">Find a word that links some of your team's cards. Avoid the black one.</div></div>
      <form id="cf" class="panel" style="display:flex;flex-direction:column;gap:10px">
        <div class="field"><label for="cw">One-word clue</label><input id="cw" value="${esc(ui.word)}" maxlength="24" autocomplete="off" autocapitalize="characters" placeholder="e.g. OCEAN"></div>
        <div class="field"><label>How many of your words does it connect to?</label>
          <div class="nums">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" class="${ui.num === n ? "sel" : ""}" data-num="${n}">${n}</button>`).join("")}</div></div>
        <button class="btn primary full">Send clue: ${ui.word ? esc(ui.word.toUpperCase()) : "…"} · ${ui.num}</button>
      </form>`;
  }

  app.addEventListener("click", e => {
    if (!document.body.classList.contains("phone")) return;
    const a = e.target.closest("[data-team],[data-role],[data-vote],[data-num],[data-rename]");
    if (!a) return;
    if (a.dataset.team) return send({ t: "team", team: a.dataset.team });
    if (a.dataset.role) return send({ t: "role", clue: a.dataset.role === "1" });
    if (a.dataset.rename) return nameForm();
    if (a.dataset.num) { ui.num = +a.dataset.num; return render(); }
    if (a.dataset.vote !== undefined && V && V.votes) {
      const raw = a.dataset.vote === "pass" ? "pass" : +a.dataset.vote;
      const v = V.votes.mine === raw ? null : raw;
      V.votes.mine = v; render();
      send({ t: "vote", v });
    }
  });
  app.addEventListener("input", e => { if (e.target.id === "cw") { ui.word = e.target.value.replace(/\s/g, ""); if (e.target.value !== ui.word) e.target.value = ui.word; const b = document.querySelector("#cf .btn.primary"); if (b) b.textContent = `Send clue: ${ui.word ? ui.word.toUpperCase() : "…"} · ${ui.num}`; } });
  app.addEventListener("submit", e => {
    if (e.target.id !== "cf") return;
    e.preventDefault();
    const w = ui.word.trim();
    if (!w) return toast("Type a one-word clue first.", true);
    if (V.cards.some(c => !c.rev && c.w === w.toUpperCase())) return toast("That word is on the board — pick another.", true);
    send({ t: "clue", word: w, num: ui.num });
    ui.word = ""; ui.num = 1;
  });

  return { start };
})();

/* ============ boot ============ */
if (typeof Peer !== "function") {
  app.innerHTML = `<div class="landing"><div class="logo"><span class="r">WORD</span> <span class="b">SPIES</span></div><p>Couldn't load the connection library. Check your internet connection and reload.</p></div>`;
} else if (qs.has("host")) Host.start();
else if (qs.has("join")) Phone.start(qs.get("join"));
else Landing();
</script>
</body>
</html>
